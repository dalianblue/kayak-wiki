name: Verify build (private repo)

# 私有仓职责=构建即验证(strict); Pages镜像部署属未来公开仓
# 产物以artifact上传, 每次push可下载完整站点包

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: site-demo
      - run: mkdocs build --strict
        working-directory: site-demo
      - name: privacy guard - private emails must stay out of the repo
        run: |
          # 检查范围=创作层(排除raw/档案层——授权原文逐字保真, 原文内联系方式随许可分发不改)
          ! git grep -InE '[a-zA-Z0-9._%+-]+@(gmail|qq|163|126|outlook|hotmail|foxmail)\.' -- . ':(exclude)raw/**' || { echo "::error::私人邮箱入库(红线: 私人邮件零入库, evidence只留raw/)"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: site-demo/site
          retention-days: 30
