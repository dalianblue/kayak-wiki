name: Verify build (private repo)

# 私有仓职责=构建即验证(strict); Pages镜像部署属未来公开仓
# 产物以artifact上传, 每次push可下载完整站点包

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: site-demo
      - run: mkdocs build --strict
        working-directory: site-demo
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: site-demo/site
          retention-days: 30
