<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260">
  <!-- 皮划艇剪影自绘资产 rights: own -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc8e8"/>
      <stop offset="1" stop-color="#2a6f97"/>
    </linearGradient>
  </defs>
  <rect width="800" height="260" fill="url(#water)"/>
  <circle cx="660" cy="60" r="34" fill="#fdf6d8" opacity="0.9"/>
  <!-- 远山 -->
  <path d="M0 200 Q120 120 240 190 T520 180 T800 195 V260 H0 Z" fill="#144552" opacity="0.55"/>
  <!-- 水面 -->
  <rect x="0" y="205" width="800" height="55" fill="url(#water)" opacity="0.9"/>
  <!-- 艇体 -->
  <path d="M180 218 Q400 196 620 214 Q400 244 180 218 Z" fill="#1b4332"/>
  <!-- 桨手 -->
  <circle cx="400" cy="188" r="11" fill="#e8e4d8"/>
  <path d="M392 199 Q400 212 408 199" stroke="#e8e4d8" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- 双叶桨 -->
  <line x1="330" y1="172" x2="470" y2="204" stroke="#8d5524" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="328" cy="170" rx="14" ry="7" fill="#8d5524" transform="rotate(-30 328 170)"/>
  <ellipse cx="472" cy="206" rx="14" ry="7" fill="#8d5524" transform="rotate(-30 472 206)"/>
  <!-- 涟漪 -->
  <path d="M210 230 Q400 252 600 226" stroke="#eaf6ff" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
