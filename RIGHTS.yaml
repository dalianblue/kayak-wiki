# ============================================================
# RIGHTS.yaml — kayak-wiki 授权台账（版权=一等元数据，1113施主定）
# 首诊: 2026-11-13 | 32书全量 | 卒年等事实均带 evidence 来源
#
# 口径:
#   rights 六态: own / cc / book-licensed / book-orphan /
#                book-uncleared / unknown(fail-closed按私有)
#   公有时点(中国法)=最晚在世作者卒年+50(至该年12月31日); 合著取最晚卒年
#   美国法独立(1929前出版=已PD; 其余多数按出版+95年)——属地问题,暂只记不算
#   翻译作品: 译者另有独立版权线, 原作者PD≠译本PD(见各条 notes)
#   书内照片: 版权可能独立属于摄影师——每书版权页单独核查, 文/图两条线
#   数据契约: 模型/脚本重跑不得回退本台账的人工结论(GPT-TOP3-3)
#   outreach_priority: 1=核心书+在世+路径短; 2=核心/在册但次要; 3=参考层
# ============================================================

